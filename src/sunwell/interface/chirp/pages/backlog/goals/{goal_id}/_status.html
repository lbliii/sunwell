{% import "alert.html" as ui %}

{% block action_status %}
{% call ui.alert(variant="success" if success else "error") %}
    {{ message }}

    {% if success and session_id %}
    <div class="cluster" style="gap: var(--space-sm); margin-top: var(--space-md);">
        <a href="/observatory" class="btn btn--sm btn--ghost">
            View All Sessions →
        </a>
        <a href="/observatory/runs/{{ session_id }}" class="btn btn--sm btn--primary">
            Track This Session →
        </a>
    </div>
    {% end %}
{% end %}
{% end %}
