{% block modal_content %}
<div class="chirpui-modal chirpui-modal--open" id="new-project-modal">
    <div class="chirpui-modal__backdrop" onclick="document.getElementById('new-project-modal').remove()"></div>
    <div class="chirpui-modal__content">
        <div class="chirpui-modal__header">
            <h2>Create New Project</h2>
            <button class="chirpui-btn chirpui-btn--ghost chirpui-btn--sm"
                    onclick="document.getElementById('new-project-modal').remove()">
                &times;
            </button>
        </div>

        <form hx-post="/projects/new"
              hx-target="#new-project-modal"
              hx-swap="outerHTML"
              hx-indicator="#create-spinner"
              style="padding: var(--chirpui-spacing-lg);">

            <div class="chirpui-stack chirpui-stack--lg">
                <div class="chirpui-field {% if errors and 'name' in errors %}chirpui-field--error{% end %}">
                    <label class="chirpui-field__label" for="name">Project Name *</label>
                    <input type="text"
                           id="name"
                           name="name"
                           value="{{ form.name if form else '' }}"
                           placeholder="My Awesome Project"
                           maxlength="64"
                           class="chirpui-field__input"
                           required
                           autofocus>
                    {% if errors and 'name' in errors %}
                        <span class="chirpui-field__error">{{ errors.name[0] }}</span>
                    {% end %}
                    <span class="chirpui-field__hint">Required, max 64 characters</span>
                </div>

                <div class="chirpui-field {% if errors and 'path' in errors %}chirpui-field--error{% end %}">
                    <label class="chirpui-field__label" for="path">Location (Optional)</label>
                    <input type="text"
                           id="path"
                           name="path"
                           value="{{ form.path if form else '' }}"
                           placeholder="~/Sunwell/projects/my-project"
                           class="chirpui-field__input">
                    {% if errors and 'path' in errors %}
                        <span class="chirpui-field__error">{{ errors.path[0] }}</span>
                    {% end %}
                    <span class="chirpui-field__hint">Leave empty to use default location</span>
                </div>

                <div class="chirpui-form-actions" style="justify-content: flex-end;">
                    <button type="button"
                            class="chirpui-btn chirpui-btn--ghost"
                            onclick="document.getElementById('new-project-modal').remove()">
                        Cancel
                    </button>
                    <button type="submit" class="chirpui-btn chirpui-btn--primary">
                        Create Project
                        <span class="htmx-indicator" id="create-spinner"></span>
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>
{% end %}
