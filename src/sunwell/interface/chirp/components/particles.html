{# Floating light particles - ambient holy magic #}

{% def ambient_particles(count=6) %}
<div class="particle-container">
  {% for i in range(count) %}
    <div class="particle"></div>
  {% end %}
</div>
{% end %}

{# Concentrated particle burst effect #}
{% def particle_burst(trigger_selector="") %}
<div class="particle-burst-container"
     {% if trigger_selector %}data-trigger="{{ trigger_selector }}"{% end %}>
</div>

<script>
(function() {
  function createBurst(x, y) {
    const container = document.querySelector('.particle-burst-container');
    if (!container) return;

    for (let i = 0; i < 12; i++) {
      const particle = document.createElement('div');
      particle.className = 'burst-particle';
      particle.style.left = x + 'px';
      particle.style.top = y + 'px';

      const angle = (i / 12) * Math.PI * 2;
      const distance = 50 + Math.random() * 50;
      const dx = Math.cos(angle) * distance;
      const dy = Math.sin(angle) * distance;

      particle.style.setProperty('--dx', dx + 'px');
      particle.style.setProperty('--dy', dy + 'px');
      particle.style.animationDuration = (0.6 + Math.random() * 0.4) + 's';

      container.appendChild(particle);

      setTimeout(() => particle.remove(), 1000);
    }
  }

  {% if trigger_selector %}
  document.addEventListener('click', (e) => {
    if (e.target.matches('{{ trigger_selector }}')) {
      createBurst(e.clientX, e.clientY);
    }
  });
  {% end %}

  window.createParticleBurst = createBurst;
})();
</script>

<style>
.particle-burst-container {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 9999;
}

.burst-particle {
  position: absolute;
  width: 6px;
  height: 6px;
  background: oklch(95% 0.2 90);
  border-radius: 50%;
  box-shadow:
    0 0 10px oklch(90% 0.18 90),
    0 0 20px oklch(85% 0.18 90 / 0.6);
  animation: burst-particle 0.8s ease-out forwards;
}

@keyframes burst-particle {
  0% {
    opacity: 1;
    transform: translate(0, 0) scale(1);
  }
  100% {
    opacity: 0;
    transform: translate(var(--dx), var(--dy)) scale(0);
  }
}
</style>
{% end %}
