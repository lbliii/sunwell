{# Command Palette - Keyboard-driven command interface #}

{% def command_palette(commands=[]) %}
<div id="command-palette"
     class="command-palette"
     style="display: none;"
     role="dialog"
     aria-label="Command palette">

  <div class="command-backdrop" onclick="closeCommandPalette()"></div>

  <div class="command-dialog bio-card">
    <div class="command-header">
      <input type="text"
             id="command-input"
             class="command-input"
             placeholder="Type a command or search..."
             autocomplete="off"
             spellcheck="false"
             aria-label="Command input">
      <kbd class="command-hint">ESC to close</kbd>
    </div>

    <div class="command-results stack stack-xs" id="command-results">
      {# Results populated by JavaScript #}
    </div>

    <div class="command-footer cluster">
      <div class="command-shortcuts cluster cluster-sm">
        <kbd>↑↓</kbd> Navigate
        <kbd>⏎</kbd> Select
        <kbd>/</kbd> Search
      </div>
    </div>
  </div>
</div>

<script>
(function() {
  const COMMANDS = [
    // Navigation
    { id: 'nav-home', title: 'Go to Home', url: '/', icon: '✦', category: 'Navigation', keywords: ['home', 'dashboard'] },
    { id: 'nav-projects', title: 'Go to Projects', url: '/projects', icon: '📁', category: 'Navigation', keywords: ['projects', 'list'] },
    { id: 'nav-observatory', title: 'Go to Observatory', url: '/observatory', icon: '🔭', category: 'Navigation', keywords: ['observatory', 'runs', 'executions'] },
    { id: 'nav-dag', title: 'Go to DAG Viewer', url: '/dag', icon: '🕸️', category: 'Navigation', keywords: ['dag', 'graph', 'execution'] },
    { id: 'nav-writer', title: 'Go to Writer', url: '/writer', icon: '✍️', category: 'Navigation', keywords: ['writer', 'compose'] },
    { id: 'nav-backlog', title: 'Go to Backlog', url: '/backlog', icon: '📋', category: 'Navigation', keywords: ['backlog', 'tasks'] },
    { id: 'nav-memory', title: 'Go to Memory', url: '/memory', icon: '🧠', category: 'Navigation', keywords: ['memory', 'knowledge'] },
    { id: 'nav-settings', title: 'Go to Settings', url: '/settings', icon: '⚙️', category: 'Navigation', keywords: ['settings', 'config'] },
    { id: 'nav-showcase', title: 'Go to Design System', url: '/biomorphic-showcase', icon: '🎨', category: 'Navigation', keywords: ['design', 'showcase', 'components'] },

    // Actions
    { id: 'action-new-project', title: 'Create New Project', url: '/projects/new', icon: '✦', category: 'Actions', keywords: ['new', 'create', 'project'] },
    { id: 'action-search', title: 'Search Projects', action: () => document.querySelector('[name="search"]')?.focus(), icon: '🔍', category: 'Actions', keywords: ['search', 'find'] },

    // Themes
    { id: 'theme-holy', title: 'Holy Light Theme', action: () => window.setTheme?.('holy-light'), icon: '✦', category: 'Themes', keywords: ['theme', 'holy', 'light', 'gold'] },
    { id: 'theme-void', title: 'Void Theme', action: () => window.setTheme?.('void'), icon: '◆', category: 'Themes', keywords: ['theme', 'void', 'purple'] },
    { id: 'theme-forest', title: 'Forest Theme', action: () => window.setTheme?.('forest'), icon: '🌲', category: 'Themes', keywords: ['theme', 'forest', 'green'] },
    { id: 'theme-ocean', title: 'Ocean Theme', action: () => window.setTheme?.('ocean'), icon: '🌊', category: 'Themes', keywords: ['theme', 'ocean', 'blue'] },

    // System
    { id: 'system-refresh', title: 'Refresh Page', action: () => location.reload(), icon: '🔄', category: 'System', keywords: ['refresh', 'reload'] },
    { id: 'system-copy-url', title: 'Copy Current URL', action: () => navigator.clipboard.writeText(location.href), icon: '📋', category: 'System', keywords: ['copy', 'url', 'link'] },
  ];

  let selectedIndex = 0;
  let filteredCommands = [];
  let isOpen = false;

  function openCommandPalette() {
    const palette = document.getElementById('command-palette');
    const input = document.getElementById('command-input');

    if (!palette || !input) return;

    isOpen = true;
    palette.style.display = 'block';
    input.value = '';
    input.focus();

    renderResults(COMMANDS);
  }

  function closeCommandPalette() {
    const palette = document.getElementById('command-palette');
    if (!palette) return;

    isOpen = false;
    palette.style.display = 'none';
    selectedIndex = 0;
  }

  function filterCommands(query) {
    if (!query.trim()) return COMMANDS;

    const lowerQuery = query.toLowerCase();
    return COMMANDS.filter(cmd => {
      const searchText = [
        cmd.title,
        cmd.category,
        ...(cmd.keywords || [])
      ].join(' ').toLowerCase();

      return searchText.includes(lowerQuery);
    }).sort((a, b) => {
      // Prioritize title matches
      const aTitle = a.title.toLowerCase();
      const bTitle = b.title.toLowerCase();
      const aStarts = aTitle.startsWith(lowerQuery);
      const bStarts = bTitle.startsWith(lowerQuery);

      if (aStarts && !bStarts) return -1;
      if (!aStarts && bStarts) return 1;
      return 0;
    });
  }

  function renderResults(commands) {
    filteredCommands = commands;
    selectedIndex = Math.min(selectedIndex, filteredCommands.length - 1);

    const container = document.getElementById('command-results');
    if (!container) return;

    if (filteredCommands.length === 0) {
      container.innerHTML = `
        <div class="command-empty center">
          <span style="font-size: 2rem; opacity: 0.5;">🔍</span>
          <p class="text-muted">No commands found</p>
        </div>
      `;
      return;
    }

    let currentCategory = null;
    let html = '';

    filteredCommands.forEach((cmd, index) => {
      if (cmd.category !== currentCategory) {
        currentCategory = cmd.category;
        html += `<div class="command-category">${currentCategory}</div>`;
      }

      html += `
        <a href="${cmd.url || '#'}"
           class="command-item ${index === selectedIndex ? 'selected' : ''}"
           data-index="${index}"
           ${cmd.action ? `onclick="event.preventDefault(); (${cmd.action})(); closeCommandPalette(); return false;"` : ''}
           ${!cmd.url ? 'role="button"' : ''}>
          <span class="command-icon">${cmd.icon}</span>
          <span class="command-title">${cmd.title}</span>
          ${cmd.shortcut ? `<kbd class="command-shortcut">${cmd.shortcut}</kbd>` : ''}
        </a>
      `;
    });

    container.innerHTML = html;

    // Scroll selected into view
    const selected = container.querySelector('.command-item.selected');
    if (selected) {
      selected.scrollIntoView({ block: 'nearest' });
    }
  }

  function executeCommand(index) {
    const cmd = filteredCommands[index];
    if (!cmd) return;

    closeCommandPalette();

    if (cmd.action) {
      cmd.action();
    } else if (cmd.url) {
      window.location.href = cmd.url;
    }
  }

  function selectNext() {
    selectedIndex = Math.min(selectedIndex + 1, filteredCommands.length - 1);
    renderResults(filteredCommands);
  }

  function selectPrevious() {
    selectedIndex = Math.max(selectedIndex - 1, 0);
    renderResults(filteredCommands);
  }

  // Keyboard shortcuts
  document.addEventListener('keydown', (e) => {
    // Cmd+K or Ctrl+K to open
    if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
      e.preventDefault();
      if (isOpen) {
        closeCommandPalette();
      } else {
        openCommandPalette();
      }
      return;
    }

    // ESC to close
    if (e.key === 'Escape' && isOpen) {
      closeCommandPalette();
      return;
    }

    if (!isOpen) return;

    // Arrow navigation
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      selectNext();
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      selectPrevious();
    }

    // Enter to execute
    else if (e.key === 'Enter') {
      e.preventDefault();
      executeCommand(selectedIndex);
    }
  });

  // Input handling
  document.addEventListener('DOMContentLoaded', () => {
    const input = document.getElementById('command-input');
    if (!input) return;

    input.addEventListener('input', (e) => {
      selectedIndex = 0;
      const filtered = filterCommands(e.target.value);
      renderResults(filtered);
    });

    // Click on results
    document.addEventListener('click', (e) => {
      const item = e.target.closest('.command-item');
      if (item) {
        const index = parseInt(item.dataset.index, 10);
        executeCommand(index);
      }
    });
  });

  // Expose globally
  window.openCommandPalette = openCommandPalette;
  window.closeCommandPalette = closeCommandPalette;

  console.log('⌨️  Command Palette ready (Cmd/Ctrl+K)');
})();
</script>

<style>
.command-palette {
  position: fixed;
  inset: 0;
  z-index: var(--z-modal);
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding-block-start: 15vh;
}

.command-backdrop {
  position: absolute;
  inset: 0;
  background: oklch(0% 0 0 / 0.7);
  backdrop-filter: blur(8px);
  animation: fade-in var(--duration-fast) var(--ease-out);
}

.command-dialog {
  position: relative;
  width: 90%;
  max-width: 600px;
  max-height: 70vh;
  display: flex;
  flex-direction: column;

  background: var(--color-surface-elevated);
  border: 1px solid oklch(40% 0 0);
  box-shadow:
    0 20px 60px oklch(0% 0 0 / 0.5),
    0 0 0 1px oklch(50% 0 0 / 0.1);

  animation: command-slide-in var(--duration-slow) var(--ease-out);
}

@keyframes command-slide-in {
  from {
    opacity: 0;
    transform: translateY(-20px) scale(0.95);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

.command-header {
  display: flex;
  align-items: center;
  gap: var(--space-sm);
  padding: var(--space-md);
  border-bottom: 1px solid var(--color-border);
}

.command-input {
  flex: 1;
  background: none;
  border: none;
  color: var(--color-text);
  font-size: var(--text-lg);
  outline: none;
}

.command-input::placeholder {
  color: var(--color-text-muted);
}

.command-hint {
  font-size: var(--text-xs);
  padding: var(--space-2xs) var(--space-xs);
  background: oklch(20% 0 0);
  border-radius: var(--radius-sm);
  color: var(--color-text-muted);
}

.command-results {
  flex: 1;
  overflow-y: auto;
  padding: var(--space-sm);
  gap: var(--space-3xs);
}

.command-category {
  padding: var(--space-xs) var(--space-sm);
  font-size: var(--text-xs);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--color-text-muted);
  margin-block-start: var(--space-sm);
}

.command-category:first-child {
  margin-block-start: 0;
}

.command-item {
  display: flex;
  align-items: center;
  gap: var(--space-sm);

  padding: var(--space-sm) var(--space-md);
  border-radius: var(--radius-lg);

  text-decoration: none;
  color: var(--color-text);

  transition: all var(--duration-fast) var(--ease-out);
  cursor: pointer;
}

.command-item:hover,
.command-item.selected {
  background: oklch(22% 0 0);
  box-shadow: 0 0 0 1px oklch(35% 0 0);
}

.command-item.selected {
  background: linear-gradient(
    135deg,
    oklch(25% 0.05 85) 0%,
    oklch(22% 0.03 85) 100%
  );
  box-shadow:
    0 0 0 1px oklch(40% 0.08 85),
    0 0 20px oklch(70% 0.13 85 / 0.2);
}

.command-icon {
  font-size: 1.2em;
  width: 1.5em;
  text-align: center;
}

.command-title {
  flex: 1;
  font-size: var(--text-base);
}

.command-shortcut {
  font-size: var(--text-xs);
  padding: var(--space-3xs) var(--space-2xs);
  background: oklch(18% 0 0);
  border-radius: var(--radius-xs);
  color: var(--color-text-muted);
}

.command-footer {
  padding: var(--space-sm) var(--space-md);
  border-top: 1px solid var(--color-border);
  justify-content: space-between;
}

.command-shortcuts {
  font-size: var(--text-xs);
  color: var(--color-text-muted);
}

.command-shortcuts kbd {
  padding: var(--space-3xs) var(--space-2xs);
  background: oklch(18% 0 0);
  border-radius: var(--radius-xs);
  font-family: monospace;
}

.command-empty {
  padding: var(--space-xl);
}
</style>
{% end %}
